name: Test Health Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Gate: detect if this run was triggered by a Devin commit ───
  detect-author:
    name: Detect Commit Author
    runs-on: ubuntu-latest
    outputs:
      is_devin: ${{ steps.check.outputs.is_devin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          AUTHOR=$(git log -1 --format='%an' HEAD)
          EMAIL=$(git log -1 --format='%ae' HEAD)
          echo "Commit author: $AUTHOR ($EMAIL)"
          if echo "$AUTHOR" | grep -qi "devin" || echo "$EMAIL" | grep -qi "devin"; then
            echo "is_devin=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_devin=false" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════════════════
  # PHASE 1 — Human commit: health checks + trigger Devin if needed
  # ═══════════════════════════════════════════════════════════════

  health-check-base:
    name: Health Check (Base Branch)
    needs: detect-author
    if: needs.detect-author.outputs.is_devin == 'false'
    runs-on: ubuntu-latest
    outputs:
      base_passed: ${{ steps.test.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        id: test
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm run test:coverage 2>&1
          if [ $? -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  health-check-pr:
    name: Health Check (PR Branch)
    needs: detect-author
    if: needs.detect-author.outputs.is_devin == 'false'
    runs-on: ubuntu-latest
    outputs:
      pr_passed: ${{ steps.test.outputs.passed }}
      pr_failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        id: test
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          TEST_OUTPUT=$(npm run test:coverage 2>&1)
          TEST_EXIT=$?
          echo "$TEST_OUTPUT"
          if [ $TEST_EXIT -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            FAILURES=$(echo "$TEST_OUTPUT" | grep -E "FAIL|ERROR|✗|×" | head -30 || echo "See workflow logs")
            {
              echo "failures<<FAIL_EOF"
              echo "$FAILURES"
              echo "FAIL_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Comment on PR
        if: steps.test.outputs.passed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "## Health Check Failed (PR Branch)

          Tests are failing on the PR branch. Triggering Devin to update the test suite.

          \`\`\`
          ${{ steps.test.outputs.failures }}
          \`\`\`"

  trigger-devin:
    name: Trigger Devin (Test Suite Update)
    needs: health-check-pr
    if: needs.health-check-pr.outputs.pr_passed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Create Devin session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          TEST_FAILURES: ${{ needs.health-check-pr.outputs.pr_failures }}
        run: |
          PROMPT=$(cat <<PROMPT_END
          You are updating the test suite for PR #${PR_NUMBER} in repository ${REPO}.

          Steps:
          1. Clone the repository ${REPO} and checkout branch '${PR_BRANCH}'.
          2. View the code diffs: git diff origin/${BASE_BRANCH}...HEAD
          3. Review the failing tests:
          ${TEST_FAILURES}
          4. Update or add test files ONLY to make the test suite pass against the new code changes.
          5. Run \`cd frontend && npm run test:coverage\` to verify all tests pass before pushing.
          6. Commit with message: "ci: update test suite for PR #${PR_NUMBER}"
          7. Push directly to branch '${PR_BRANCH}'.

          Constraints:
          - Do NOT modify any source code files. Only add or modify test files (e.g., files in frontend/src/components/__tests__/ or similar test directories).
          - Do NOT create a new pull request. Push directly to the existing PR branch.
          - Do NOT change coverage thresholds in vite.config.ts.
          - After pushing, exit the session immediately.
          PROMPT_END
          )

          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)

          REQUEST_BODY=$(jq -n \
            --argjson prompt "$ESCAPED_PROMPT" \
            --arg title "Update test suite for PR #${PR_NUMBER}" \
            --arg repo "$REPO" \
            '{
              prompt: $prompt,
              title: $title,
              repos: [$repo],
              tags: ["test-update", "automated"]
            }')

          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer ${DEVIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY" \
            "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/sessions")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '/^HTTP_STATUS:/d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | grep '^HTTP_STATUS:' | cut -d: -f2)

          if [ "$HTTP_CODE" -eq 200 ]; then
            SESSION_URL=$(echo "$HTTP_BODY" | jq -r '.url')
            SESSION_ID=$(echo "$HTTP_BODY" | jq -r '.session_id')
            echo "Devin session created: ${SESSION_URL}"
            {
              echo "## Devin Test Update Triggered"
              echo ""
              echo "Devin is updating the test suite for this PR."
              echo "**Session:** ${SESSION_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Failed to create Devin session (HTTP ${HTTP_CODE})"
            echo "$HTTP_BODY"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2 — Devin commit: re-run tests, create Jira if still failing
  # ═══════════════════════════════════════════════════════════════

  rerun-tests:
    name: Re-run Tests (Post-Devin)
    needs: detect-author
    if: needs.detect-author.outputs.is_devin == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.test.outputs.passed }}
      failures: ${{ steps.test.outputs.failures }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        id: test
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          TEST_OUTPUT=$(npm run test:coverage 2>&1)
          TEST_EXIT=$?
          echo "$TEST_OUTPUT"
          if [ $TEST_EXIT -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            FAILURES=$(echo "$TEST_OUTPUT" | grep -E "FAIL|ERROR|✗|×" | head -30 || echo "See workflow logs")
            {
              echo "failures<<FAIL_EOF"
              echo "$FAILURES"
              echo "FAIL_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

  create-jira-ticket:
    name: Create Jira Ticket
    needs: rerun-tests
    if: |
      needs.rerun-tests.outputs.passed == 'false' &&
      !contains(github.event.pull_request.user.login, 'devin')
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira ticket and comment on PR
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          FAILURES: ${{ needs.rerun-tests.outputs.failures }}
        run: |
          JIRA_PAYLOAD=$(jq -n \
            --arg summary "PR #${PR_NUMBER}: Tests failing after automated test update" \
            --arg description "Devin updated the test suite but tests are still failing.\n\nRepository: ${REPO}\nPR: https://github.com/${REPO}/pull/${PR_NUMBER}\nBranch: ${PR_BRANCH}\n\nFailing tests:\n${FAILURES}" \
            --arg project "${JIRA_PROJECT_KEY}" \
            '{fields: {project: {key: $project}, summary: $summary, description: $description, issuetype: {name: "Bug"}}}')

          JIRA_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Basic $(echo -n "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" | base64)" \
            -H "Content-Type: application/json" \
            -d "$JIRA_PAYLOAD" \
            "${JIRA_BASE_URL}/rest/api/2/issue")

          JIRA_KEY=$(echo "$JIRA_RESPONSE" | jq -r '.key')

          if [ "$JIRA_KEY" != "null" ] && [ -n "$JIRA_KEY" ]; then
            gh pr comment ${PR_NUMBER} --body "## Tests Still Failing

            Devin updated the test suite but some tests are still failing. A Jira ticket has been created: [${JIRA_KEY}](${JIRA_BASE_URL}/browse/${JIRA_KEY})

            \`\`\`
            ${FAILURES}
            \`\`\`"
            echo "Jira ticket created: ${JIRA_KEY}"
          else
            echo "::error::Failed to create Jira ticket"
            echo "$JIRA_RESPONSE"
            gh pr comment ${PR_NUMBER} --body "## Tests Still Failing

            Devin updated the test suite but some tests are still failing. Failed to create Jira ticket automatically — please create one manually.

            \`\`\`
            ${FAILURES}
            \`\`\`"
            exit 1
          fi
